<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mizan Treasury Preprod Deployer</title>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="color:red; background:#222; padding:15px; margin:10px; font-family:monospace; border-radius:4px;"><b>Script Error:</b> ' + e.message + '<br><small>' + e.filename + ':' + e.lineno + '</small></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="color:orange; background:#222; padding:15px; margin:10px; font-family:monospace; border-radius:4px;"><b>Promise Error:</b> ' + (e.reason?.message || e.reason) + '</div>';
      });
    </script>
  </head>
  <body style="background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
