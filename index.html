    <title>Mizan Treasury — Midnight Preprod Vault</title>
    <script>
      // Intercept and swallow injected EVM provider connection errors immediately
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).includes('MetaMask') || String(event.reason).includes('ethereum'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
